name: Build and Release xray-rust

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            arch: linux-armv7
            desc: "ARMv7 hard-float (Cortex-A7/A9, IPQ40xx, BCM4709)"
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64
            desc: "ARM64 (Cortex-A53/A72, RPi 4/5, MT798x)"
          - target: x86_64-unknown-linux-musl
            arch: linux-x86_64
            desc: "x86_64 (64-bit Mini-PC, Soft router)"
          - target: i686-unknown-linux-musl
            arch: linux-x86_32
            desc: "x86 32-bit (Legacy PC)"
          - target: arm-unknown-linux-musleabi
            arch: linux-armv5
            desc: "ARMv5/v6 soft-float (Legacy ARM)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(date +'%y.%m.%d')
          fi
          echo "version=${V}" >> $GITHUB_OUTPUT
          echo "Building version ${V} for ${{ matrix.target }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild and upx
        run: |
          pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Cross-compile binary
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          RUSTFLAGS="-A deprecated" cargo zigbuild --package xray-cli --bin xray-rust --release --target ${{ matrix.target }}

      - name: Package binary and UPX compression
        run: |
          OUT_DIR="dist"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          BIN_PATH="target/${{ matrix.target }}/release/xray-rust"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH=$(find target -name "xray-rust" -type f | grep -E "release/xray-rust$" | head -n 1)
          fi

          if [ -n "$BIN_PATH" ] && [ -f "$BIN_PATH" ]; then
            STD_NAME="xray-rust_${{ matrix.arch }}"
            UPX_NAME="xray-rust-upx_${{ matrix.arch }}"

            cp "$BIN_PATH" "$OUT_DIR/$STD_NAME"
            cp "$BIN_PATH" "$OUT_DIR/$UPX_NAME"
            upx --best "$OUT_DIR/$UPX_NAME" || true
            chmod +x "$OUT_DIR"/*

            ls -lh "$OUT_DIR"
          else
            echo "ERROR: Could not find xray-rust binary for ${{ matrix.target }}!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-rust_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Compute unified checksums
        run: |
          mkdir -p release_assets
          find downloaded -type f ! -name "*checksum*" ! -name "SHA256SUMS*" -exec cp -v {} release_assets/ \;
          cd release_assets
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "=== Release Assets ==="
          ls -la release_assets/
          if gh release view "${{ github.ref_name }}" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Removing existing release ${{ github.ref_name }} to purge old assets..."
            gh release delete "${{ github.ref_name }}" -R "$GH_REPO" -y --cleanup-tag=false || true
          fi
          echo "Creating fresh published release ${{ github.ref_name }}..."
          gh release create "${{ github.ref_name }}" release_assets/* \
            -R "$GH_REPO" \
            --title "${{ github.ref_name }}" \
            --notes "LiteWall Xray-Rust multi-architecture release for OpenWrt" \
            --draft=false
