name: Build and Release xray-rust

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            arch: linux-armv7
            desc: "ARMv7 hard-float (Cortex-A7/A9, IPQ40xx, BCM4709)"
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64
            desc: "ARM64 (Cortex-A53/A72, RPi 4/5, MT798x)"
          - target: x86_64-unknown-linux-musl
            arch: linux-x86_64
            desc: "x86_64 (64-bit Mini-PC, Soft router)"
          - target: i686-unknown-linux-musl
            arch: linux-x86_32
            desc: "x86 32-bit (Legacy PC)"
          - target: arm-unknown-linux-musleabi
            arch: linux-armv5
            desc: "ARMv5/v6 soft-float (Legacy ARM)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(date +'%y.%m.%d')
          fi
          echo "version=${V}" >> $GITHUB_OUTPUT
          echo "Building version ${V} for ${{ matrix.target }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild and upx
        run: |
          pip install cargo-zigbuild
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Cross-compile binary
        run: |
          cargo zigbuild --package xray-cli --bin xray-rust --release --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Capture build log on failure
        if: failure()
        run: |
          echo "### Build failure on ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ matrix.arch }}
          path: build.log

      - name: Package binary and UPX compression
        run: |
          {
            set -x
            echo "=== Target Directory ==="
            find target -type f -name "xray-rust*" || true

            OUT_DIR="stage"
            rm -rf "$OUT_DIR"
            mkdir -p "$OUT_DIR"

            BIN_PATH=$(find target -name "xray-rust" -type f 2>/dev/null | grep -E "release/xray-rust$" | head -n 1)
            echo "Selected BIN_PATH: '$BIN_PATH'"

            if [ -n "$BIN_PATH" ] && [ -f "$BIN_PATH" ]; then
              cp "$BIN_PATH" "$OUT_DIR/xray-rust"
              cp "$BIN_PATH" "$OUT_DIR/xray-rust-upx"
              upx --best "$OUT_DIR/xray-rust-upx" || true
              chmod +x "$OUT_DIR"/*

              ARCHIVE="xray-rust_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.tar.gz"
              tar -czf "$ARCHIVE" -C "$OUT_DIR" .
              sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
              ls -lh "$ARCHIVE"
            else
              echo "ERROR: Could not find xray-rust binary!"
              find target -type f || true
              exit 1
            fi
          } 2>&1 | tee package.log

      - name: Capture packaging log on failure
        if: failure()
        run: |
          echo "### Packaging failure log for ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat package.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-rust_${{ steps.ver.outputs.version }}_${{ matrix.arch }}
          path: |
            xray-rust_*.tar.gz
            xray-rust_*.sha256

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Compute unified checksums
        run: |
          mkdir -p release_assets
          find downloaded -type f -name "*.tar.gz" -exec cp -v {} release_assets/ \;
          cd release_assets
          ls -la
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "=== Release Assets ==="
          ls -la release_assets/
          if gh release view "${{ github.ref_name }}" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists, uploading assets..."
            gh release upload "${{ github.ref_name }}" release_assets/* -R "$GH_REPO" --clobber
          else
            echo "Creating release ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" release_assets/* \
              -R "$GH_REPO" \
              --title "${{ github.ref_name }}" \
              --notes "LiteWall Xray-Rust multi-architecture release for OpenWrt"
          fi
